---
# Replaces the plaintext Secret that used to live in git.
# Credentials are read from AWS Secrets Manager, populated by the
# database Terraform stack (terraform/db -> aws_secretsmanager_secret.db).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: auto-repair-homolog/database
        property: DATABASE_PASSWORD
    # HS256 secret shared with the authentication Lambda.
    - secretKey: JWT_SECRET
      remoteRef:
        key: auto-repair-homolog/api
        property: JWT_SECRET
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: datadog-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: datadog-secret
    creationPolicy: Owner
  data:
    - secretKey: DD_API_KEY
      remoteRef:
        key: auto-repair-homolog/datadog
        property: DD_API_KEY
